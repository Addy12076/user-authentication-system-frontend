<!DOCTYPE html>
<html>
<head>
  <title>Register</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="css/register.css" rel="stylesheet">
</head>
<body>

<div class="register-wrapper">
  <div class="register-card">

    <div class="register-header">
      REGISTRATION FORM
    </div>

    <div class="register-body">
      <form id="registerForm">

        <div class="mb-3">
          <label>Full Name</label>
          <input type="text" id="name" class="form-control" placeholder="Enter your name" required>
        </div>

        <div class="mb-3">
          <label>Email</label>
          <input type="email" id="email" class="form-control" placeholder="example@email.com" required>
        </div>

        <div class="mb-3">
          <label>Password</label>
          <input type="password" id="password" class="form-control" placeholder="Enter password" required>
        </div>

        <div class="mb-1">
          <small id="strengthText" class="fw-bold"></small>
        </div>

        <div class="mb-4">
          <label>Confirm Password</label>
          <input type="password" id="cpassword" class="form-control" placeholder="Confirm password" required>
        </div>

        <button class="btn btn-register">
          REGISTER
        </button>

      </form>
    </div>

  </div>
</div>

<!-- FOOTER -->

<script src="js/register.js"></script>
</body>
</html>
