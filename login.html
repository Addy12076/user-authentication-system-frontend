<!DOCTYPE html>
<html>
<head>
  <title>Login</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="./css/login.css">
</head>

<body>

<!-- MAIN CONTENT -->
<div class="main-content">

  <div class="container mt-5">
    <h3>Login</h3>

    <form id="loginForm">
      <input type="email" id="email" class="form-control mb-2" placeholder="Email" required>
      <input type="password" id="password" class="form-control mb-2" placeholder="Password" required>
      <button class="btn btn-primary w-100">Login</button>
    </form>

    <div id="otpSection" style="display:none;" class="mt-3">
      <input type="number" id="otpInput" class="form-control mb-2" placeholder="Enter OTP">
      <p id="otpTimer"></p>
      <button class="btn w-100" id="verifyOtpBtn">Verify OTP</button>
    </div>
  </div>

</div>

<!-- FOOTER -->
<footer>
  © 2026 User Authentication System | Built using HTML, CSS, Bootstrap & JavaScript
</footer>

<script src="js/login.js"></script>
</body>
</html>
