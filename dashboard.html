<!DOCTYPE html>
<html>
<head>
  <title>Dashboard</title>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">

  <!-- Dashboard CSS -->
  <link rel="stylesheet" href="css/dashboard.css">
</head>

<body>

<!-- MAIN CONTENT (centers dashboard and pushes footer down) -->
<div class="main-content">

  <div class="dashboard-container">

    <h2 class="dashboard-title">Dashboard</h2>

    <!-- USER INFO CARD -->
    <div class="user-card">
      <h3 id="userName"></h3>
      <p id="userEmail"></p>
      <span class="status">Active</span>
    </div>

    <!-- ACTION BUTTONS -->
    <div class="action-buttons">
      <a href="profile.html" class="btn btn-warning">Edit Profile</a>
      <a href="logout.html" class="btn btn-danger">Logout</a>
    </div>

  </div>

</div>

<!-- FOOTER -->
<footer>
  © 2026 User Authentication System | Design and developed by  <a href="https://kavyainfoweb.com/" target="_blank"> Kavya Infoweb Private Ltd</a> 
</footer>

<!-- DASHBOARD SCRIPT -->
<script>
  // Protect dashboard
  if (!localStorage.getItem("isLoggedIn")) {
    window.location.href = "login.html";
  }

  // Get user data
  let user = JSON.parse(localStorage.getItem("user"));

  // Display user data using DOM
  document.getElementById("userName").innerText = `Welcome, ${user.name}`;
  document.getElementById("userEmail").innerText = `Email: ${user.email}`;
</script>

</body>
</html>
